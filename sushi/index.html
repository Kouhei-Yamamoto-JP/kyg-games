<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>回転寿司ゲーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Start screen -->
    <section id="start-screen" class="screen">
      <div class="panel">
        <h1 class="title">🍣 回転寿司</h1>
        <p class="subtitle">材料で寿司を作ってレーンに出すと、注文のお客さんが自動で取ってくれるよ！</p>
        <ul class="howto">
          <li>材料で寿司を作る（レベルでネタが増える）</li>
          <li>「レーンに出す」で空き皿に乗せる</li>
          <li>注文と合う皿がお客さんの前を通ると自動で配膳</li>
          <li>時間切れでライフ減少（❤️×3）／レベルアップで新ネタ解放</li>
        </ul>
        <button id="btn-start" class="btn primary" type="button">スタート</button>
      </div>
    </section>

    <!-- Game screen -->
    <section id="game-screen" class="screen hidden">
      <header id="hud">
        <div class="hud-item">
          <span class="hud-label">スコア</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">レベル</span>
          <span id="level" class="hud-value">1</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">ライフ</span>
          <span id="lives" class="hud-value lives">❤️❤️❤️</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">お客</span>
          <span id="customer-count" class="hud-value">1</span>
        </div>
      </header>

      <div id="customers" aria-label="お客さん"></div>

      <div id="belt-area">
        <div id="belt-track">
          <div class="belt-inner"></div>
          <div id="plates"></div>
        </div>
        <div class="shop-sign">回転寿司</div>
      </div>

      <div id="craft-panel" aria-label="寿司づくり">
        <div id="craft-progress" class="craft-progress">材料を選んでね</div>
        <div id="craft-preview" class="craft-preview" aria-hidden="true"><span class="sushi-icon empty-dish size-lg" aria-hidden="true"></span></div>
        <div id="craft-ingredients" class="craft-ingredients" role="group" aria-label="材料"></div>
        <button id="btn-place" class="btn place" type="button" disabled>レーンに出す</button>
      </div>

      <div id="toast" class="toast hidden" aria-live="polite"></div>
    </section>

    <!-- Game over screen -->
    <section id="gameover-screen" class="screen hidden">
      <div class="panel">
        <h2 class="title">ゲームオーバー</h2>
        <p class="final-score">スコア: <strong id="final-score">0</strong></p>
        <p class="final-hint" id="final-hint"></p>
        <button id="btn-retry" class="btn primary" type="button">もう一度</button>
      </div>
    </section>
  </div>
  <script src="game.js"></script>
</body>
</html>
